<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Medication — PharmaFulfill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="{{ url_for('staff_dashboard') }}">PharmaFulfill DBMS</a>
    <a href="{{ url_for('Logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>

<main class="container py-4">
  <h3 class="mb-3">Add New Medication</h3>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  {% if success %}
    <div class="alert alert-success">{{ success }}</div>
  {% endif %}

  <form action="{{ url_for('add_medication') }}" method="post">
    <div class="mb-3">
      <label for="ndc" class="form-label">NDC Code</label>
      <input type="text" class="form-control" id="ndc" name="ndc" maxlength="12" required>
    </div>
    <div class="mb-3">
      <label for="name" class="form-label">Drug Name</label>
      <input type="text" class="form-control" id="name" name="name" maxlength="120" required>
    </div>
    <div class="mb-3">
      <label for="strength" class="form-label">Strength</label>
      <input type="text" class="form-control" id="strength" name="strength" maxlength="40">
    </div>
    <div class="mb-3">
      <label for="form" class="form-label">Form</label>
      <input type="text" class="form-control" id="form" name="form" maxlength="40">
    </div>
    <button type="submit" class="btn btn-primary">Submit Medication</button>
    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

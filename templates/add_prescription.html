<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Prescription — PharmaFulfill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="{{ url_for('staff_dashboard') }}">PharmaFulfill DBMS</a>
    <a href="{{ url_for('Logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>

<main class="container py-4">
  <h3 class="mb-3">Add New Prescription</h3>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  {% if success %}
    <div class="alert alert-success">{{ success }}</div>
  {% endif %}

  <form action="{{ url_for('add_prescription') }}" method="post">
    <div class="mb-3">
      <label for="patientid" class="form-label">Patient ID</label>
      <input type="number" class="form-control" id="patientid" name="patientid" required>
    </div>
    <div class="mb-3">
      <label for="prescriberid" class="form-label">Prescriber ID</label>
      <input type="number" class="form-control" id="prescriberid" name="prescriberid" required>
    </div>
    <div class="mb-3">
      <label for="drugid" class="form-label">Drug ID</label>
      <input type="number" class="form-control" id="drugid" name="drugid" required>
    </div>
    <div class="mb-3">
      <label for="dosage" class="form-label">Dosage</label>
      <input type="text" class="form-control" id="dosage" name="dosage">
    </div>
    <div class="mb-3">
      <label for="qty" class="form-label">Quantity</label>
      <input type="number" class="form-control" id="qty" name="qty">
    </div>
    <div class="mb-3">
      <label for="refills" class="form-label">Total Refills</label>
      <input type="number" class="form-control" id="refills" name="refills">
    </div>
    <div class="mb-3">
      <label for="dateissued" class="form-label">Date Issued</label>
      <input type="date" class="form-control" id="dateissued" name="dateissued" required>
    </div>
    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status">
        <option value="Pending">Pending</option>
        <option value="Printed">Printed</option>
        <option value="Filled">Filled</option>
        <option value="Ready">Ready</option>
        <option value="Sold">Sold</option>
        <option value="PendingRenewal">PendingRenewal</option>
        <option value="Denied">Denied</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit Prescription</button>
    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

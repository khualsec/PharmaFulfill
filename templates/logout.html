<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout — PharmaFulfill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    let countdown = 5;
    function updateCountdown() {
      document.getElementById("countdown").textContent = countdown;
      if (countdown === 0) {
        window.location.href = "/";
      }
      countdown--;
    }
    window.onload = function() {
      updateCountdown();
      setInterval(updateCountdown, 1000);
    };
  </script>
</head>
<body class="bg-light">
  <div class="container mt-5 text-center">
    <h1 class="text-success">You have successfully logged out</h1>
    <p>Thank you for using PharmaFulfill.</p>
    <p>You will be redirected to the homepage in <span id="countdown">5</span> seconds.</p>
    <a href="/" class="btn btn-outline-primary mt-3">Go now</a>
  </div>
</body>
</html>

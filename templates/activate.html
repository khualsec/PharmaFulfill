<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaFulfill — Activate Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="index.html">PharmaFulfill Patient Signup</a>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h4 class="mb-3">Activate Your Patient Account</h4>
          <form action="/activate" method="post" onsubmit="return validateActivation();">
            <!-- Identity on file -->
            <div class="row g-3">
              <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input id="firstName" name="first_name" type="text" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input id="lastName" name="last_name" type="text" class="form-control" required>
            </div>
          <div class="col-md-4">
            <label class="form-label">Date of Birth</label>
             <input id="dob" name="dob" type="date" class="form-control" required>
          </div>
          <div class="col-md-8">
            <label class="form-label">Email</label>
            <input id="email" name="email" type="email" class="form-control" placeholder="user@gmail.com" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Phone</label>
            <input id="phone" name="phone" type="tel" class="form-control" placeholder="615-123-4567" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Address</label>
            <input id="address" name="address" type="text" class="form-control" placeholder="123 Main St, City, State" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Insurance ID</label>
            <input id="insuranceID" name="insurance_id" type="number" class="form-control" placeholder="Enter Insurance ID">
          </div>
        </div>

        <hr class="my-4">

        <!-- Password setup -->
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Create Password</label>
            <input id="password" name="password" type="password" class="form-control" minlength="6" required oninput="checkStrength();">
            <div id="strength" class="form-text small mt-1"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input id="confirm" type="password" class="form-control" minlength="6" required>
          </div>
        </div>

        <div class="form-check mt-3">
          <input class="form-check-input" type="checkbox" id="tos" required>
          <label class="form-check-label" for="tos">
            I confirm my identity and agree to create this account.
         </label>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
         <a href="/" class="btn btn-outline-secondary">Cancel</a>
         <button class="btn btn-primary">Activate Account</button>
        </div>

        <div id="errorBox" class="alert alert-danger mt-3 d-none"></div>
      </form>
        </div>
      </div>
      <div class="text-center mt-3 small">
        <a class="link-secondary" href="dashboard.html">← Back to Patient Login</a>
      </div>
    </div>
  </div>
</main>

<script>
function validateActivation(){
  const err = document.getElementById('errorBox');
  err.classList.add('d-none'); err.textContent = '';

  const pw = document.getElementById('password').value.trim();
  const cf = document.getElementById('confirm').value.trim();
  if (pw !== cf){
    err.textContent = 'Passwords do not match.';
    err.classList.remove('d-none');
    return false;
  }
  // Demo: just do basic checks; real verification happens server-side later.
  return true;
}

function checkStrength(){
  const s = document.getElementById('strength');
  const pw = document.getElementById('password').value;
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const msgs = ['Very weak','Weak','Okay','Good','Strong'];
  s.textContent = 'Strength: ' + msgs[Math.max(0, score-1)];
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

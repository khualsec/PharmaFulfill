<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate Staff Account — PharmaFulfill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="{{ url_for('staff_dashboard') }}">PharmaFulfill DBMS</a>
    <a href="{{ url_for('Logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>

<main class="container py-4">
  <h3 class="mb-3">Activate Staff Account</h3>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  {% if success %}
    <div class="alert alert-success">{{ success }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('activate_staff') }}">
    <div class="mb-3">
      <label for="fullname" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="fullname" name="fullname" required>
    </div>

    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select class="form-select" id="role" name="role" required>
        <option value="">Select Role</option>
        <option value="Tech">Tech</option>
        <option value="Pharmacist">Pharmacist</option>
        <option value="Admin">Admin</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="text" class="form-control" id="password" name="password" required>
    </div>

    <button type="submit" class="btn btn-primary">Activate Account</button>
    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

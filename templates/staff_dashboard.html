<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaFulfill — Staff Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="#">Welcome, {{ staff_name }} ({{ role }})</a>
    <a href="{{ url_for('Logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>

<main class="container py-4">
  <h3 class="mb-3">Staff Dashboard</h3>
  <div class="mb-3">
    <a href="{{ url_for('add_prescription') }}" class="btn btn-primary">
      + Add Prescription
    </a>
  </div>
  <div class="card">
    <div class="card-header">Pending Prescriptions</div>
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th>RxID</th><th>Patient</th><th>Drug</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for rx in prescriptions %}
          <tr>
            <td>{{ rx.RxID }}</td>
            <td>{{ rx.PatientID }}</td>
            <td>{{ rx.DrugID }}</td>
            <td><span class="badge bg-warning text-dark">{{ rx.Status }}</span></td>
            <td>
              <button class="btn btn-sm btn-success">Verify</button>
              <button class="btn btn-sm btn-info">Mark Ready</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharmacy Portal — Staff Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="staff_login.html">Pharmacy DBMS</a>
    <a href="staff_login.html" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>
<main class="container py-4">
  <h3 class="mb-3">Staff Dashboard (Demo)</h3>
  <div class="card">
    <div class="card-header">Pending Prescriptions</div>
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th>RxID</th><th>Patient</th><th>Drug</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>10241</td><td>Alex Nguyen</td><td>Amoxicillin</td>
            <td><span class="badge bg-warning text-dark">Pending</span></td>
            <td>
              <button class="btn btn-sm btn-success">Verify</button>
              <button class="btn btn-sm btn-info">Mark Ready</button>
            </td>
          </tr>
          <tr>
            <td>10212</td><td>Brooke Smith</td><td>Ibuprofen</td>
            <td><span class="badge bg-success">Ready</span></td>
            <td>
              <button class="btn btn-sm btn-secondary">Complete Sale</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

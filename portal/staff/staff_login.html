<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaFulfill — Staff Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <h3 class="mb-0">PharmaFulfill</h3>
              <div class="text-muted">Staff Sign In</div>
            </div>

            <form action="{{ url_for('staff_login_post') }}" method="post" onsubmit="return validateForm();">
              <div class="mb-3">
                <label class="form-label">Staff ID</label>
                <input id="staffid" name="staffid" type="text" class="form-control" placeholder="Enter Staff ID (number)" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Role</label>
                <select id="role" name="role" class="form-select" required>
                  <option value="">Select Role</option>
                  <option value="Tech">Tech</option>
                  <option value="Pharmacist">Pharmacist</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>

            <div class="d-flex justify-content-between mt-3 small">
              <a href="{{ url_for('home') }}" class="link-secondary">Patient Login</a>
              <span class="text-secondary"></span>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

<script>
function validateForm(){
  const id = document.getElementById('staffid').value.trim();
  const role = document.getElementById('role').value.trim();
  const pwd = document.getElementById('password').value.trim();
  if(!id || !role || !pwd){
    alert('Please fill in all fields.');
    return false;
  }
  if(isNaN(parseInt(id))){ alert('Staff ID must be a number.'); return false; }
  return true;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

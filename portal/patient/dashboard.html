<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaFulfill — Patient Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <h3 class="mb-0">PharmaFulfill</h3>
              <div class="text-muted">Patient Sign In</div>
            </div>
            <form action="/login" method="post" onsubmit="return validateForm();">
              <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="email" name="email" type="email" class="form-control" placeholder="user@gmail.com" required>
              </div>
              <div class="mb-3">
              <label class="form-label">Password</label>
              <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" minlength="6" required>
              </div>
             <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <div class="d-flex justify-content-between mt-3 small">
              <a href="Forgot_password.html" class="link-secondary">Forgot password?</a>
              <a href="/activate" class="link-secondary">Activate account</a>
            </div>
            <div class="text-center mt-3 small">
              <a href="staff_login.html" class="link-dark">Staff Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
function validateForm(){
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('password').value.trim();
  if(!email || !pwd){ return false; }
  return true;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

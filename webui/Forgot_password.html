<!doctyle html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PharmaFulfill Portal — Forgot Password</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="static/styles.css" rel="stylesheet">
    </head>
    <body class="bg-light d-flex align-items-center" style="min-height:100vh;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <div class="text-center mb-3">
                                <h3 class="mb-0">PharmaFulfill</h3>
                                <div class="text-muted">Forgot Password</div>
                            </div>
                            <form action="index.html" method="get" onsubmit="return validateForm();">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input id="email" type="email" class="form-control" placeholder="user@gmail.com" required>
                                </div>
                                <button class="btn btn-primary w-100">Reset Password</button>
                            </form>
                            <div class="text-center mt-3 small">
                                <a href="index.html" class="link-dark">Back to Sign In</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            function validateForm() {
                const email = document.getElementById('email').value.trim();
                if (!email) { return false; }
                return true;
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaFulfill — Patient Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="index.html">Patient Dashboard</a>
    <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>
<main class="container py-4">
  <h3 class="mb-3">My Prescriptions (Demo)</h3>
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th>RxID</th><th>Drug</th><th>Dosage</th><th>Qty</th>
            <th>Refills</th><th>Status</th><th>ETA</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>10241</td><td>Amoxicillin</td><td>500mg</td><td>30</td>
            <td>1/3</td><td><span class="badge bg-warning text-dark">Pending</span></td><td>~20 min</td>
          </tr>
          <tr>
            <td>10212</td><td>Ibuprofen</td><td>200mg</td><td>20</td>
            <td>0/2</td><td><span class="badge bg-success">Ready</span></td><td>Now</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

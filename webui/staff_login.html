<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaFulfill — Staff Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div class="text-center mb-3">
              <h3 class="mb-0">PharmaFulfill</h3>
              <div class="text-muted">Staff Sign In</div>
            </div>
            <form action="staff_dashboard.html" method="get" onsubmit="return validateForm();">
              <div class="mb-3">
                <label class="form-label">Staff ID</label>
                <input id="staffid" type="text" class="form-control" placeholder="Enter Staff ID" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control" placeholder="Enter password" minlength="6" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Role</label>
                <select id="role" class="form-select" required>
                  <option value="">Select role...</option>
                  <option value="Tech">Technician</option>
                  <option value="Pharmacist">Pharmacist</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>
              <button class="btn btn-primary w-100">Sign In</button>
            </form>
            <div class="d-flex justify-content-between mt-3 small">
              <a href="index.html" class="link-secondary">← Patient Login</a>
              <a href="Forgot_password.html" class="link-secondary">Forgot password?</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
function validateForm(){
  const staffid = document.getElementById('staffid').value.trim();
  const pwd = document.getElementById('password').value.trim();
  const role = document.getElementById('role').value.trim();
  if(!staffid || !pwd || !role){ return false; }
  return true;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
